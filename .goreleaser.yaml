version: 2

project_name: grepmail

before:
  hooks:
    - go mod tidy

builds:
  - id: grepmail
    main: ./cmd/grepmail
    binary: grepmail
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tajchert/grepmail/internal/cli.Version={{ .Version }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

brews:
  - name: grepmail
    homepage: "https://github.com/tajchert/grepmail"
    description: "Fast, grep-style CLI for searching and exploring mbox mail archives"
    license: "MIT"
    repository:
      owner: tajchert
      name: homebrew-tap
    directory: Formula
    test: |
      assert_match "grepmail", shell_output("#{bin}/grepmail version")

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:.*$"
      order: 0
    - title: Fixes
      regexp: "^.*fix[(\\w)]*:.*$"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: tajchert
    name: grepmail
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    ---
    **Install (Homebrew):**
    ```bash
    brew install tajchert/tap/grepmail
    ```

    **Install (Go):**
    ```bash
    go install github.com/tajchert/grepmail/cmd/grepmail@v{{ .Version }}
    ```
